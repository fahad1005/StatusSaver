// App module build file: app id, versions, and library dependencies.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.fahad1005.statussaver'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fahad1005.statussaver'
        minSdk 24
        targetSdk 34
        versionCode 8
        versionName '1.6'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // Ads (AdMob). Shows Google's SAMPLE test ads until you add your own IDs (see README).
    implementation 'com.google.android.gms:play-services-ads:23.0.0'
}
